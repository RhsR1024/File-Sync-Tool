[package]
name = "app"
version = "1.0.7"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tokio = { version = "1.49.0", features = ["full"] }
chrono = "0.4.43"
regex = "1.12.3"
env_logger = "0.11.8"
fs_extra = "1.3.0"
tauri-plugin-single-instance = "2.4.0"
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
ssh2 = "0.9.5"
tauri-plugin-clipboard-manager = "2.3.2"
flate2 = "1"
rfd = "0.14"
reqwest = { version = "0.11", features = ["json"] }
encoding_rs = "0.8"
chardetng = "0.1"
base64 = "0.22"
redis = { version = "0.25", features = ["tokio-comp"] }
rand = "0.8"

# Screen sharing
scrap = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
axum = { version = "0.7", features = ["multipart"] }
async-stream = "0.3"
bytes = "1"
local-ip-address = "0.6"
sha2 = "0.10"
argon2 = "0.5"
subtle = "2.6"
zip = "2"
async_zip = { version = "0.0.17", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["io", "codec", "compat"] }
futures-lite = "2"
mime_guess = "2"
ipnet = "2"
trash = "5"
rust-embed = "8"

# Clipboard manager tool (spec §14.1)
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
clipboard-master = "4"
arboard = "3"
enigo = "0.2"
parking_lot = "0.12"
blake3 = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
rayon = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
