<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concept B: 高效的顶部 SaaS 导航栏</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-slate-800">

  <!-- 顶部导航栏 -->
  <header class="h-16 w-full bg-white/80 backdrop-blur-md border-b border-slate-200/60 flex items-center px-8 z-50 fixed top-0 shrink-0">
    <div class="flex items-center gap-3 mr-12">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-md">
        <i data-lucide="server" class="text-white w-4 h-4"></i>
      </div>
      <span class="font-bold text-[17px] tracking-tight">File Sync Tool</span>
    </div>
    
    <nav class="flex items-center gap-1 h-full">
      <a href="#" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors">控制台</a>
      <a href="#" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors">历史任务</a>
      <a href="#" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors">设备设置</a>
      
      <!-- 带有 Mega menu / Dropdown 的工具入口 -->
      <div class="relative group h-full flex items-center">
        <a href="#" class="px-4 py-2 rounded-lg text-sm font-semibold text-blue-600 bg-blue-50 flex items-center gap-2">
          工具箱 <i data-lucide="chevron-down" class="w-4 h-4"></i>
        </a>
        
        <!-- Hover 悬浮显示超级菜单 -->
        <div class="absolute top-[60px] left-0 w-[480px] bg-white border border-slate-200 shadow-[0_20px_40px_rgba(0,0,0,0.08)] rounded-2xl p-4 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 translate-y-2 group-hover:translate-y-0 z-50">
           <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 px-2">常用辅助工具</h4>
           <div class="grid grid-cols-2 gap-2">
              <div class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer transition">
                <div class="p-2 rounded-lg bg-blue-50 text-blue-600"><i data-lucide="shield" class="w-5 h-5"></i></div>
                <div>
                   <p class="text-sm font-bold text-slate-800">开启 SSH</p>
                   <p class="text-xs text-slate-500 mt-0.5">临时开启设备调试端口</p>
                </div>
              </div>
              <div class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer transition">
                <div class="p-2 rounded-lg bg-purple-50 text-purple-600"><i data-lucide="monitor-up" class="w-5 h-5"></i></div>
                <div>
                   <p class="text-sm font-bold text-slate-800">屏幕共享</p>
                   <p class="text-xs text-slate-500 mt-0.5">跨设备投送屏幕内容</p>
                </div>
              </div>
              <div class="flex items-start gap-3 p-3 rounded-xl hover:bg-slate-50 cursor-pointer transition">
                <div class="p-2 rounded-lg bg-emerald-50 text-emerald-600"><i data-lucide="bar-chart-3" class="w-5 h-5"></i></div>
                <div>
                   <p class="text-sm font-bold text-slate-800">代码统计</p>
                   <p class="text-xs text-slate-500 mt-0.5">代码变更量追踪查询</p>
                </div>
              </div>
           </div>
           <div class="mt-2 pt-2 border-t border-slate-100 px-2">
             <a href="#" class="text-sm text-blue-600 font-medium hover:underline flex items-center gap-1">查看所有工具 <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
           </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- 主绘图区 （由于去掉了左侧边栏，横向视野被完全释放） -->
  <main class="flex-1 mt-16 p-8 overflow-y-auto w-full max-w-7xl mx-auto flex items-center justify-center">
    <div class="w-full bg-white rounded-3xl border border-slate-200 shadow-sm p-12 min-h-[600px] flex flex-col items-center justify-center relative overflow-hidden">
       <!-- 这是假装我们在这个工具内部 -->
       <div class="absolute inset-0 opacity-30 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-100 via-transparent to-transparent"></div>
       <div class="w-20 h-20 bg-blue-600 rounded-[28px] shadow-2xl shadow-blue-500/40 flex items-center justify-center mb-6 relative z-10 text-white">
          <i data-lucide="shield" class="w-10 h-10"></i>
       </div>
       <h1 class="text-3xl font-extrabold text-slate-900 z-10 mb-2">一体机 SSH 权限控制</h1>
       <p class="text-slate-500 z-10">您可以直接通过顶部导航栏随时切换到其他工具，不再纠结左边栏点击。</p>
       
       <button class="mt-10 px-8 py-3 bg-slate-900 text-white rounded-full shadow-lg font-medium tracking-wide z-10 hover:bg-slate-800 transition">一键授权接入</button>
    </div>
  </main>
  
  <script>lucide.createIcons();</script>
</body>
</html>
