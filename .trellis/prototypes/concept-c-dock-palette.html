<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concept C: 极简 Dock + 全局面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: #111827; /* 深色主题为了炫酷对比，或者可以换成极浅 */
      color: white;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex">

  <!-- 极简 Dock -->
  <aside class="w-16 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-6 shrink-0 z-10">
    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-md mb-8">
      <i data-lucide="server" class="text-white w-5 h-5"></i>
    </div>
    
    <div class="flex flex-col gap-4 w-full">
      <div class="w-full flex justify-center group relative cursor-pointer">
        <div class="p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition"><i data-lucide="activity" class="w-5 h-5"></i></div>
      </div>
      <div class="w-full flex justify-center group relative cursor-pointer">
        <div class="p-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition"><i data-lucide="list-checks" class="w-5 h-5"></i></div>
      </div>
      
      <!-- 工具的 Dock 按键 -->
      <div class="w-full flex justify-center group relative cursor-pointer mt-4">
        <!-- 侧边指示条 -->
        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-blue-500 rounded-r-md"></div>
        <div class="p-2.5 rounded-xl text-blue-400 bg-blue-500/10 transition shadow-inner">
           <i data-lucide="layout-grid" class="w-5 h-5"></i>
        </div>
      </div>
    </div>
  </aside>

  <!-- 假装这是业务区 -->
  <main class="flex-1 overflow-hidden relative">
      <!-- 暗色背景下的玻璃态工具方阵 -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-900 to-black p-10">
          <h2 class="text-3xl font-bold mb-8">所有工具</h2>
          <div class="grid grid-cols-4 gap-6">
             <div class="h-40 rounded-2xl border border-slate-800 bg-slate-800/50 flex flex-col items-center justify-center text-slate-400 hover:border-slate-600 cursor-pointer">
               <i data-lucide="shield" class="w-8 h-8 text-blue-400 mb-3"></i> 一体机 SSH
             </div>
             <div class="h-40 rounded-2xl border border-slate-800 bg-slate-800/50 flex flex-col items-center justify-center text-slate-400 hover:border-slate-600 cursor-pointer">
               <i data-lucide="globe" class="w-8 h-8 text-indigo-400 mb-3"></i> 网络测试
             </div>
             <!-- others... -->
          </div>
      </div>

      <!-- 全局呼出的快捷面板 Ctrl+K 特效 -->
      <div class="absolute inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-start justify-center pt-32">
         <div class="w-[600px] bg-slate-800/90 border border-slate-700 shadow-[0_0_50px_rgba(0,0,0,0.5)] rounded-2xl overflow-hidden backdrop-blur-xl animate-[slideDown_0.2s_ease-out]">
            <!-- 搜索栏 -->
            <div class="flex items-center gap-3 px-4 py-4 border-b border-slate-700/50">
               <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
               <input type="text" placeholder="搜索工具、日志或设置 (Cmd/Ctrl + K)..." class="flex-1 bg-transparent border-none outline-none text-white text-lg placeholder:text-slate-500" value="SS">
               <span class="px-2 py-1 bg-slate-700 rounded text-xs font-mono text-slate-400">ESC</span>
            </div>
            
            <!-- 结果区 -->
            <div class="p-2 max-h-[400px] overflow-y-auto">
               <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-widest px-3 py-2">工具 (Tools)</h4>
               
               <div class="flex items-center gap-3 px-3 py-3 rounded-xl bg-blue-600 text-white cursor-pointer shadow-lg shadow-blue-500/20">
                 <i data-lucide="shield" class="w-5 h-5"></i>
                 <div class="flex-1">
                    <p class="text-sm font-semibold">开启一体机 <span class="bg-blue-400/30 px-1 rounded">SS</span>H</p>
                    <p class="text-xs text-blue-200 mt-0.5">安全隧道白名单管理</p>
                 </div>
                 <i data-lucide="corner-down-left" class="w-4 h-4 opacity-70"></i>
               </div>

               <div class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 cursor-pointer mt-1">
                 <i data-lucide="monitor-up" class="w-5 h-5"></i>
                 <div class="flex-1">
                    <p class="text-sm font-semibold">屏幕共享 (<span class="bg-slate-600 px-1 rounded text-white">S</span>creen <span class="bg-slate-600 px-1 rounded text-white">S</span>hare)</p>
                 </div>
               </div>
            </div>
         </div>
      </div>
  </main>
  
  <style>
    @keyframes slideDown {
      from { transform: translateY(-20px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
  </style>

  <script>lucide.createIcons();</script>
</body>
</html>
