<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concept A: 玻璃态悬浮孤岛侧边栏</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 40%),
                  linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex text-slate-800">

  <!-- 悬浮毛玻璃侧边栏 -->
  <aside class="w-64 my-6 ml-6 flex flex-col justify-between bg-white/60 backdrop-blur-xl border border-white/70 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[24px] overflow-hidden z-10 shrink-0">
    <div class="px-6 py-6 pb-2 border-b border-white/40">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-[14px] bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-blue-500/30">
          <i data-lucide="server" class="text-white w-5 h-5"></i>
        </div>
        <span class="font-bold text-lg bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-blue-500 tracking-tight">Sync Tool</span>
      </div>
    </div>
    
    <div class="flex-1 px-4 py-4 space-y-1">
      <div class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-500 hover:bg-white/50 cursor-pointer transition-colors">
        <i data-lucide="activity" class="w-5 h-5"></i> <span class="font-medium text-[15px]">控制台</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-500 hover:bg-white/50 cursor-pointer transition-colors">
        <i data-lucide="list-checks" class="w-5 h-5"></i> <span class="font-medium text-[15px]">任务执行</span>
      </div>
      
      <!-- 选中的工具类 -> 在浅色主题下的手风琴 -->
      <div class="flex flex-col mt-2">
        <div class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-50 text-blue-600 shadow-sm border border-blue-100/50 cursor-pointer">
          <i data-lucide="layout-grid" class="w-5 h-5"></i> 
          <span class="font-bold text-[15px] flex-1">其他工具</span>
          <i data-lucide="chevron-down" class="w-4 h-4"></i>
        </div>
        <!-- 极其优雅的子层级 -->
        <div class="pl-7 mt-1.5 space-y-1">
          <div class="flex items-center gap-2.5 px-3 py-2 text-sm text-slate-500 hover:text-slate-900 cursor-pointer rounded-lg hover:bg-white/40 transition">
            <span class="w-1 h-1 rounded-full bg-slate-300"></span>
            修改框架密码
          </div>
          <div class="relative flex items-center gap-2.5 px-3 py-2 text-sm text-blue-600 font-medium cursor-pointer rounded-lg bg-white/50 shadow-sm border border-white/60">
            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 rounded-r bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.6)]"></div>
            开启一体机 SSH
          </div>
          <div class="flex items-center gap-2.5 px-3 py-2 text-sm text-slate-500 hover:text-slate-900 cursor-pointer rounded-lg hover:bg-white/40 transition">
            <span class="w-1 h-1 rounded-full bg-slate-300"></span>
            网络功能
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 主绘图区 -->
  <main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-3xl font-extrabold text-slate-800 mb-2">其他工具</h1>
      <p class="text-slate-500 mb-10">轻巧的统一环境，玻璃质感的卡片</p>
      
      <div class="grid grid-cols-3 gap-6">
        <!-- 卡片示例 -->
        <div class="bg-white/70 backdrop-blur border border-white p-6 rounded-[24px] shadow-[0_10px_40px_rgba(0,0,0,0.03)] hover:-translate-y-1 transition transform duration-300">
           <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/20 mb-4">
             <i data-lucide="key" class="text-white w-6 h-6"></i>
           </div>
           <h3 class="text-lg font-bold text-slate-800 mb-2">框架默认密码</h3>
           <p class="text-sm text-slate-500 mb-6">修改系统上 admin 账户的默认安全入口...</p>
           <button class="w-full py-2.5 bg-slate-100/80 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm transition">进入应用</button>
        </div>
        
        <div class="bg-white/70 backdrop-blur border border-white p-6 rounded-[24px] shadow-xl shadow-blue-900/5 hover:-translate-y-1 transition transform duration-300 relative overflow-hidden ring-2 ring-blue-400/50">
           <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-400/10 rounded-full blur-xl"></div>
           <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20 mb-4">
             <i data-lucide="shield" class="text-white w-6 h-6"></i>
           </div>
           <h3 class="text-lg font-bold text-slate-800 mb-2">开启一体机 SSH</h3>
           <p class="text-sm text-slate-500 mb-6">临时开启后端 SSH 安全防火墙与白名单配置</p>
           <button class="w-full py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold rounded-xl text-sm transition border border-blue-200">正在使用</button>
        </div>
      </div>
    </div>
  </main>
  
  <script>lucide.createIcons();</script>
</body>
</html>
