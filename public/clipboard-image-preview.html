<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipboard Image Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      cursor: default;
      pointer-events: auto;
      user-select: none;
      border-radius: 22px;
    }
    body {
      background: transparent;
      overflow: hidden;
    }
    .shell {
      display: flex;
      min-height: 100%;
      height: 100%;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 22px;
      background:
        radial-gradient(circle at top, rgba(148, 163, 184, 0.18), transparent 55%),
        linear-gradient(180deg, rgba(248, 250, 252, 0.98), rgba(226, 232, 240, 0.92));
      backdrop-filter: blur(18px);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.18);
    }
    .label {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #64748b;
    }
    .source {
      margin: 6px 0 0;
      font-size: 14px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .source:empty {
      display: none;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 28px -24px rgba(15, 23, 42, 0.9);
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.74);
      color: #475569;
      font-size: 16px;
      line-height: 1;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
    }
    .icon-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }
    .icon-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .icon-btn:disabled:hover {
      background: rgba(255, 255, 255, 0.74);
      color: #475569;
    }
    .content {
      position: relative;
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      overflow: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
      padding: 16px;
    }
    .content::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .content.has-image {
      align-items: flex-start;
      justify-content: flex-start;
    }
    .content.can-pan,
    .content.can-pan .image {
      cursor: grab;
    }
    .content.is-panning,
    .content.is-panning .image {
      cursor: grabbing;
    }
    .empty {
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
    }
    .empty[hidden] {
      display: none;
    }
    .image {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 28px 80px -36px rgba(15, 23, 42, 0.72);
      user-select: none;
      -webkit-user-drag: none;
    }
    .image.visible {
      display: block;
    }
    /* When zoomed past fit, drop max-* so the image renders at its scaled size and
       the surrounding .content scrolls. */
    .image.zoomed {
      max-width: none;
      max-height: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div>
        <p class="label">Image Preview</p>
        <p id="source" class="source"></p>
      </div>
      <div class="controls">
        <span id="zoom-label" class="badge">100%</span>
        <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="zoom-reset" class="icon-btn" type="button" aria-label="Fit to window" title="Fit to window (double-click image)">⤢</button>
        <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="fullscreen" class="icon-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen (Esc to exit)">⛶</button>
      </div>
    </header>
    <main id="content" class="content">
      <p id="empty" class="empty">Hover an image item to preview it.</p>
      <img id="image" class="image" alt="" draggable="false" />
    </main>
  </div>

  <script>
    const sourceEl = document.getElementById('source');
    const zoomLabelEl = document.getElementById('zoom-label');
    const emptyEl = document.getElementById('empty');
    const imageEl = document.getElementById('image');
    const contentEl = document.getElementById('content');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomResetBtn = document.getElementById('zoom-reset');
    const zoomInBtn = document.getElementById('zoom-in');
    const fullscreenBtn = document.getElementById('fullscreen');
    const internals = window.__TAURI_INTERNALS__ || null;

    const PREVIEW_LABEL = 'clipboard-image-preview';
    const FIT_SCALE = 1;
    const MIN_SCALE = FIT_SCALE;
    const MAX_SCALE = 6;
    const WHEEL_STEP_PERCENT = 10;

    let payload = null;
    let scale = FIT_SCALE;
    let isFullscreen = false;
    let panSession = null;

    function clampScale(value) {
      if (!Number.isFinite(value)) {
        return FIT_SCALE;
      }
      return Math.max(MIN_SCALE, Math.min(MAX_SCALE, value));
    }

    function parseCssPixels(value) {
      const parsed = Number.parseFloat(value || '0');
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function getContentViewportSize() {
      const styles = window.getComputedStyle(contentEl);
      const horizontalPadding = parseCssPixels(styles.paddingLeft) + parseCssPixels(styles.paddingRight);
      const verticalPadding = parseCssPixels(styles.paddingTop) + parseCssPixels(styles.paddingBottom);
      return {
        width: Math.max(1, contentEl.clientWidth - horizontalPadding),
        height: Math.max(1, contentEl.clientHeight - verticalPadding),
      };
    }

    function getBaseImageSize() {
      if (!payload || !imageEl.naturalWidth || !imageEl.naturalHeight) {
        return null;
      }
      const viewportSize = getContentViewportSize();
      const fitRatio = Math.min(
        viewportSize.width / imageEl.naturalWidth,
        viewportSize.height / imageEl.naturalHeight,
        1,
      );
      return {
        width: Math.max(1, Math.round(imageEl.naturalWidth * fitRatio)),
        height: Math.max(1, Math.round(imageEl.naturalHeight * fitRatio)),
      };
    }

    function getScaledImageSize(nextScale = scale) {
      const baseSize = getBaseImageSize();
      if (!baseSize) {
        return null;
      }
      return {
        width: Math.max(1, Math.round(baseSize.width * nextScale)),
        height: Math.max(1, Math.round(baseSize.height * nextScale)),
      };
    }

    function clampScrollOffset(value, maxValue) {
      if (!Number.isFinite(value)) {
        return 0;
      }
      return Math.max(0, Math.min(value, Math.max(0, maxValue)));
    }

    function clampImageRatio(value) {
      if (!Number.isFinite(value)) {
        return 0.5;
      }
      return Math.max(0, Math.min(1, value));
    }

    function getImageLayoutMetrics(nextScale = scale) {
      const viewportSize = getContentViewportSize();
      const scaledSize = getScaledImageSize(nextScale);
      if (!scaledSize) {
        return null;
      }
      const marginLeft = Math.max(0, (viewportSize.width - scaledSize.width) / 2);
      const marginTop = Math.max(0, (viewportSize.height - scaledSize.height) / 2);
      return {
        viewportWidth: viewportSize.width,
        viewportHeight: viewportSize.height,
        imageWidth: scaledSize.width,
        imageHeight: scaledSize.height,
        marginLeft,
        marginTop,
        marginRight: marginLeft,
        marginBottom: marginTop,
        contentWidth: scaledSize.width + marginLeft * 2,
        contentHeight: scaledSize.height + marginTop * 2,
      };
    }

    function resolveViewportAnchor(metrics, anchor = null) {
      return {
        x: clampScrollOffset(anchor?.x ?? metrics.viewportWidth / 2, metrics.viewportWidth),
        y: clampScrollOffset(anchor?.y ?? metrics.viewportHeight / 2, metrics.viewportHeight),
      };
    }

    function resolveImageAnchor(metrics, anchor = null) {
      const viewportAnchor = resolveViewportAnchor(metrics, anchor);
      return {
        viewportX: viewportAnchor.x,
        viewportY: viewportAnchor.y,
        ratioX: clampImageRatio(
          (contentEl.scrollLeft + viewportAnchor.x - metrics.marginLeft) / metrics.imageWidth,
        ),
        ratioY: clampImageRatio(
          (contentEl.scrollTop + viewportAnchor.y - metrics.marginTop) / metrics.imageHeight,
        ),
      };
    }

    function getScrollTargetForScale(nextScale, anchor = null) {
      const previousMetrics = getImageLayoutMetrics(scale);
      const nextMetrics = getImageLayoutMetrics(nextScale);
      if (!previousMetrics || !nextMetrics) {
        return null;
      }
      const imageAnchor = resolveImageAnchor(previousMetrics, anchor);
      return {
        left: clampScrollOffset(
          nextMetrics.marginLeft + imageAnchor.ratioX * nextMetrics.imageWidth - imageAnchor.viewportX,
          nextMetrics.contentWidth - nextMetrics.viewportWidth,
        ),
        top: clampScrollOffset(
          nextMetrics.marginTop + imageAnchor.ratioY * nextMetrics.imageHeight - imageAnchor.viewportY,
          nextMetrics.contentHeight - nextMetrics.viewportHeight,
        ),
      };
    }

    function applyScrollTarget(scrollTarget) {
      if (!scrollTarget) {
        return;
      }
      contentEl.scrollLeft = scrollTarget.left;
      contentEl.scrollTop = scrollTarget.top;
    }

    function getEventAnchor(event) {
      const rect = contentEl.getBoundingClientRect();
      const styles = window.getComputedStyle(contentEl);
      const paddingLeft = parseCssPixels(styles.paddingLeft);
      const paddingTop = parseCssPixels(styles.paddingTop);
      return {
        x: event.clientX - rect.left - paddingLeft,
        y: event.clientY - rect.top - paddingTop,
      };
    }

    function samePayloadIdentity(left, right) {
      return Boolean(left && right)
        && left.id === right.id
        && left.image_path === right.image_path;
    }

    function stepScale(currentScale, direction, stepPercent) {
      const factor = 1 + Math.max(1, Number(stepPercent) || 10) / 100;
      const nextScale = direction > 0 ? currentScale * factor : currentScale / factor;
      return clampScale(nextScale);
    }

    function render() {
      const imageMetrics = payload ? getImageLayoutMetrics(scale) : null;
      const canPan = Boolean(
        imageMetrics
        && (imageMetrics.contentWidth > imageMetrics.viewportWidth
          || imageMetrics.contentHeight > imageMetrics.viewportHeight),
      );
      zoomLabelEl.textContent = `${Math.round(scale * 100)}%`;
      zoomOutBtn.disabled = scale <= FIT_SCALE;
      zoomResetBtn.disabled = scale === FIT_SCALE;
      zoomInBtn.disabled = !payload;
      contentEl.classList.toggle('has-image', Boolean(imageMetrics));
      contentEl.classList.toggle('can-pan', canPan);
      contentEl.classList.toggle('is-panning', panSession !== null);

      if (!payload) {
        sourceEl.textContent = '';
        emptyEl.hidden = false;
        imageEl.classList.remove('visible');
        imageEl.classList.remove('zoomed');
        imageEl.removeAttribute('src');
        imageEl.style.width = '';
        imageEl.style.height = '';
        imageEl.style.marginLeft = '';
        imageEl.style.marginRight = '';
        imageEl.style.marginTop = '';
        imageEl.style.marginBottom = '';
        stopPan();
        return;
      }

      sourceEl.textContent = payload.source_app || '';
      emptyEl.hidden = true;
      imageEl.classList.add('visible');

      // Use explicit width/height plus computed margins on every zoom level so the
      // same image point can remain under the mouse and portrait images stay
      // centered on the non-overflow axis.
      if (imageMetrics) {
        imageEl.classList.toggle('zoomed', scale > FIT_SCALE);
        imageEl.style.width = `${imageMetrics.imageWidth}px`;
        imageEl.style.height = `${imageMetrics.imageHeight}px`;
        imageEl.style.marginLeft = `${imageMetrics.marginLeft}px`;
        imageEl.style.marginRight = `${imageMetrics.marginRight}px`;
        imageEl.style.marginTop = `${imageMetrics.marginTop}px`;
        imageEl.style.marginBottom = `${imageMetrics.marginBottom}px`;
      } else {
        imageEl.classList.remove('zoomed');
        imageEl.style.width = '';
        imageEl.style.height = '';
        imageEl.style.marginLeft = '';
        imageEl.style.marginRight = '';
        imageEl.style.marginTop = '';
        imageEl.style.marginBottom = '';
      }

      if (scale <= FIT_SCALE) {
        stopPan();
      }
    }

    function stopPan() {
      if (!panSession) {
        contentEl.classList.remove('is-panning');
        return;
      }
      try {
        contentEl.releasePointerCapture?.(panSession.pointerId);
      } catch (_) {
        // Ignore missing capture / detached pointer state.
      }
      panSession = null;
      contentEl.classList.remove('is-panning');
    }

    function applyPayload(nextPayload, options = {}) {
      const preserveView = Boolean(options.preserveView) && samePayloadIdentity(payload, nextPayload);
      payload = nextPayload;
      imageEl.src = internals?.convertFileSrc
        ? internals.convertFileSrc(payload.image_path)
        : payload.image_path;
      if (!preserveView) {
        scale = FIT_SCALE;
        contentEl.scrollLeft = 0;
        contentEl.scrollTop = 0;
      }
      render();
    }

    function clearPayload() {
      payload = null;
      scale = FIT_SCALE;
      render();
    }

    function setScale(nextScale, anchor = null) {
      const clampedScale = clampScale(nextScale);
      const scrollTarget = clampedScale === scale ? null : getScrollTargetForScale(clampedScale, anchor);
      scale = clampedScale;
      render();
      applyScrollTarget(scrollTarget);
    }

    function changeZoom(direction, stepPercent = null, anchor = null) {
      if (!payload || (direction < 0 && scale <= FIT_SCALE)) {
        return;
      }
      const nextScale = stepScale(scale, direction, stepPercent ?? payload.zoom_step);
      setScale(nextScale, anchor);
    }

    function resetZoom() {
      setScale(FIT_SCALE);
    }

    async function refreshPayload() {
      if (!internals?.invoke) {
        return;
      }
      try {
        const nextPayload = await internals.invoke('cb_get_image_preview_payload');
        if (nextPayload) {
          applyPayload(nextPayload, { preserveView: true });
        } else {
          clearPayload();
        }
      } catch (_) {
        clearPayload();
      }
    }

    async function emitTauri(event, payload) {
      if (!internals?.invoke) return;
      try {
        await internals.invoke('plugin:event|emit', { event, payload: payload ?? null });
      } catch (_) {
        // Best-effort; swallow.
      }
    }

    async function toggleFullscreen() {
      if (!internals?.invoke) return;
      try {
        const next = await internals.invoke('cb_toggle_preview_fullscreen', {
          label: PREVIEW_LABEL,
        });
        isFullscreen = Boolean(next);
        fullscreenBtn.classList.toggle('active', isFullscreen);
      } catch (_) {
        // Best-effort.
      }
    }

    zoomOutBtn.addEventListener('click', () => changeZoom(-1, WHEEL_STEP_PERCENT));
    zoomResetBtn.addEventListener('click', resetZoom);
    zoomInBtn.addEventListener('click', () => changeZoom(1, WHEEL_STEP_PERCENT));
    fullscreenBtn.addEventListener('click', () => { void toggleFullscreen(); });

    imageEl.addEventListener('dblclick', resetZoom);
    imageEl.addEventListener('dragstart', (event) => event.preventDefault());
    imageEl.addEventListener('load', render);
    window.addEventListener('resize', render);

    contentEl.addEventListener('pointerdown', (event) => {
      if (!payload || !contentEl.classList.contains('can-pan')) {
        return;
      }
      if (event.button !== 0 || !event.isPrimary || event.target !== imageEl) {
        return;
      }
      panSession = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        scrollLeft: contentEl.scrollLeft,
        scrollTop: contentEl.scrollTop,
      };
      contentEl.classList.add('is-panning');
      contentEl.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    contentEl.addEventListener('pointermove', (event) => {
      if (!panSession || event.pointerId !== panSession.pointerId) {
        return;
      }
      const deltaX = event.clientX - panSession.startX;
      const deltaY = event.clientY - panSession.startY;
      contentEl.scrollLeft = panSession.scrollLeft - deltaX;
      contentEl.scrollTop = panSession.scrollTop - deltaY;
      event.preventDefault();
    });

    contentEl.addEventListener('pointerup', (event) => {
      if (panSession && event.pointerId === panSession.pointerId) {
        stopPan();
      }
    });

    contentEl.addEventListener('pointercancel', (event) => {
      if (panSession && event.pointerId === panSession.pointerId) {
        stopPan();
      }
    });

    contentEl.addEventListener('lostpointercapture', (event) => {
      if (panSession && event.pointerId === panSession.pointerId) {
        stopPan();
      }
    });

    contentEl.addEventListener('wheel', (event) => {
      if (!payload) {
        return;
      }
      if (event.deltaY === 0) {
        return;
      }
      event.preventDefault();
      changeZoom(event.deltaY < 0 ? 1 : -1, WHEEL_STEP_PERCENT, getEventAnchor(event));
    }, { passive: false });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && isFullscreen) {
        event.preventDefault();
        void toggleFullscreen();
      }
    });

    // Tell the panel's hide-debounce that the preview is being hovered. Without
    // these notifications the panel's items-mouseleave timer would hide us as
    // soon as the user moves the cursor over here.
    document.body.addEventListener('mouseenter', () => {
      void emitTauri('clipboard-preview-mouse-enter', { label: PREVIEW_LABEL });
    });
    document.body.addEventListener('mouseleave', () => {
      void emitTauri('clipboard-preview-mouse-leave', { label: PREVIEW_LABEL });
    });

    async function listen(event, handler) {
      if (!internals?.invoke || !internals?.transformCallback) {
        return;
      }
      await internals.invoke('plugin:event|listen', {
        event,
        target: { kind: 'Any' },
        handler: internals.transformCallback(handler),
      });
    }

    if (internals) {
      void listen('clipboard-image-preview-update', (event) => {
        // A new payload always returns to fit-scale and exits fullscreen state in JS.
        // The Rust side already drops its saved-rect when the window is repositioned.
        isFullscreen = false;
        fullscreenBtn.classList.remove('active');
        applyPayload(event.payload);
      });
      void listen('clipboard-image-preview-clear', () => {
        clearPayload();
      });
      window.addEventListener('focus', () => {
        void refreshPayload();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          void refreshPayload();
        }
      });
      void refreshPayload();
    } else {
      render();
    }
  </script>
</body>
</html>
