<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipboard Image Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    body {
      background:
        radial-gradient(circle at top, rgba(148, 163, 184, 0.18), transparent 55%),
        linear-gradient(180deg, rgba(248, 250, 252, 0.98), rgba(226, 232, 240, 0.92));
    }
    .shell {
      display: flex;
      height: 100%;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(18px);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.18);
    }
    .label {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #64748b;
    }
    .source {
      margin: 6px 0 0;
      font-size: 14px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .source:empty {
      display: none;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 28px -24px rgba(15, 23, 42, 0.9);
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.74);
      color: #475569;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
    }
    .content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 16px;
    }
    .empty {
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
    }
    .empty[hidden] {
      display: none;
    }
    .image {
      display: none;
      max-width: none;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 28px 80px -36px rgba(15, 23, 42, 0.72);
      transform-origin: center center;
    }
    .image.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div>
        <p class="label">Image Preview</p>
        <p id="source" class="source"></p>
      </div>
      <div class="controls">
        <span id="zoom-label" class="badge">100%</span>
        <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out">-</button>
        <button id="zoom-reset" class="icon-btn" type="button" aria-label="Reset zoom">o</button>
        <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in">+</button>
      </div>
    </header>
    <main id="content" class="content">
      <p id="empty" class="empty">Hover an image item to preview it.</p>
      <img id="image" class="image" alt="" />
    </main>
  </div>

  <script>
    const sourceEl = document.getElementById('source');
    const zoomLabelEl = document.getElementById('zoom-label');
    const emptyEl = document.getElementById('empty');
    const imageEl = document.getElementById('image');
    const contentEl = document.getElementById('content');
    const internals = window.__TAURI_INTERNALS__ || null;

    const DEFAULT_SCALE = 1;
    const MIN_SCALE = 0.25;
    const MAX_SCALE = 6;

    let payload = null;
    let scale = DEFAULT_SCALE;

    function clampScale(value) {
      if (!Number.isFinite(value)) {
        return DEFAULT_SCALE;
      }
      return Math.max(MIN_SCALE, Math.min(MAX_SCALE, value));
    }

    function render() {
      zoomLabelEl.textContent = `${Math.round(scale * 100)}%`;

      if (!payload) {
        sourceEl.textContent = '';
        emptyEl.hidden = false;
        imageEl.classList.remove('visible');
        imageEl.removeAttribute('src');
        imageEl.style.transform = `scale(${DEFAULT_SCALE})`;
        return;
      }

      sourceEl.textContent = payload.source_app || '';
      emptyEl.hidden = true;
      imageEl.classList.add('visible');
      imageEl.style.transform = `scale(${scale})`;
    }

    function applyPayload(nextPayload) {
      payload = nextPayload;
      scale = DEFAULT_SCALE;
      imageEl.src = internals?.convertFileSrc
        ? internals.convertFileSrc(payload.image_path)
        : payload.image_path;
      render();
    }

    function clearPayload() {
      payload = null;
      scale = DEFAULT_SCALE;
      render();
    }

    function changeZoom(direction) {
      if (!payload) {
        return;
      }
      const step = Math.max(1, Number(payload.zoom_step) || 10) / 100;
      scale = clampScale(scale + direction * step);
      render();
    }

    async function refreshPayload() {
      if (!internals?.invoke) {
        return;
      }
      try {
        const nextPayload = await internals.invoke('cb_get_image_preview_payload');
        if (nextPayload) {
          applyPayload(nextPayload);
        } else {
          clearPayload();
        }
      } catch (_) {
        clearPayload();
      }
    }

    document.getElementById('zoom-out').addEventListener('click', () => changeZoom(-1));
    document.getElementById('zoom-reset').addEventListener('click', () => {
      scale = DEFAULT_SCALE;
      render();
    });
    document.getElementById('zoom-in').addEventListener('click', () => changeZoom(1));

    contentEl.addEventListener('wheel', (event) => {
      if (!payload) {
        return;
      }
      event.preventDefault();
      changeZoom(event.deltaY < 0 ? 1 : -1);
    }, { passive: false });

    async function listen(event, handler) {
      if (!internals?.invoke || !internals?.transformCallback) {
        return;
      }
      await internals.invoke('plugin:event|listen', {
        event,
        target: { kind: 'Any' },
        handler: internals.transformCallback(handler),
      });
    }

    if (internals) {
      void listen('clipboard-image-preview-update', (event) => {
        applyPayload(event.payload);
      });
      void listen('clipboard-image-preview-clear', () => {
        clearPayload();
      });
      window.addEventListener('focus', () => {
        void refreshPayload();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          void refreshPayload();
        }
      });
      void refreshPayload();
    } else {
      render();
    }
  </script>
</body>
</html>
