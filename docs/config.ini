[portal]
; 门户认证服务器地址
HOST=http://1.1.1.3
; 登录接口路径（相对 /ac_portal/ 目录）
LOGIN_URL=/ac_portal/login.php
; 登录页面URL（用于获取初始Cookie）
PORTAL_URL=/ac_portal/default/pc.html?template=default&tabs=pwd&dual_stack=0&vlanid=0&_ID_=0&switch_url=&url=http://1.1.1.3/homepage/index.html&controller_type=&mac=

[account]
; 域账号用户名
USERNAME=
; 域账号密码
PASSWORD=域密码
; 是否记住登录状态（1=是，0=否）
REMEMBER_PWD=1

[settings]
; 登录失败重试次数
RETRY_COUNT=3
; 重试间隔（秒）
RETRY_INTERVAL=5
; 网络等待时间（秒，开机后等待网络就绪）
NETWORK_WAIT=30
; 日志保留天数
LOG_RETAIN_DAYS=30
