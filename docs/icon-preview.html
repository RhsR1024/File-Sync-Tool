<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>File Sync Tool · 图标候选预览</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-weight: 700;
      font-size: 22px;
    }
    p.subtitle {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 120ms ease, border-color 120ms ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
    }
    .icon-box {
      width: 128px;
      height: 128px;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    .tag {
      font-size: 11px;
      color: var(--muted);
    }
    .chosen-note {
      margin-top: 24px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      min-height: 48px;
    }
    .chosen-note strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <h1>File Sync Tool · 图标候选预览</h1>
  <p class="subtitle">点击任意一个图标即可选中。选中后把候选名称告诉我，我会把对应 SVG 导出为 PNG/ICO 替换项目图标。</p>

  <div class="grid" id="grid"></div>

  <div class="chosen-note" id="chosen">尚未选择。</div>

  <script>
    const ICONS = [
      {
        name: "A. Cloud Sync",
        tag: "云同步 · 双向箭头",

          <path d="M17 40h30a8 8 0 0 0 0-16c-.3-7.5-6.4-13-13.7-13A14 14 0 0 0 20 22a10 10 0 0 0-3 18z" fill="white" fill-opacity=".95"/>
          <path d="M26 46l6-6 6 6" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M38 52l-6 6-6-6" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      },
      {

      {

        bg: "linear-gradient(135deg,#10b981,#14b8a6)",

          <rect x="14" y="12" width="36" height="42" rx="5" fill="white" fill-opacity=".95"/>
          <rect x="24" y="8" width="16" height="8" rx="2" fill="#0d9488"/>
          <line x1="22" y1="26" x2="42" y2="26" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="22" y1="34" x2="42" y2="34" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="22" y1="42" x2="34" y2="42" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
        </svg>`
      },
      {
        name: "D. Sync Circle",

          <rect x="10" y="12" width="44" height="12" rx="3" fill="white" fill-opacity=".95"/>
          <rect x="10" y="26" width="44" height="12" rx="3" fill="white" fill-opacity=".8"/>
          <rect x="10" y="40" width="44" height="12" rx="3" fill="white" fill-opacity=".65"/>

      },
      {

          <path d="M22 38l7 7 13-14" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      },
      {
        name: "H. Flow Network",

        bg: "linear-gradient(135deg,#ec4899,#a855f7)",
        svg: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="6" fill="white"/>

          <line x1="26" y1="34" x2="36" y2="34" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
        </svg>`
      },
      {
        name: "K. Bolt Transfer",
        tag: "闪电 · 极速",
        bg: "linear-gradient(135deg,#eab308,#f97316)",
        svg: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M36 6L14 36h14L20 58l28-32H34z" fill="white" fill-opacity=".95"/>
        </svg>`
      },
      {
        name: "L. Shield Sync",
        tag: "盾牌 · 安全同步",
        bg: "linear-gradient(135deg,#059669,#0891b2)",
        svg: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 6l20 8v14c0 14-8 24-20 30-12-6-20-16-20-30V14z" fill="white" fill-opacity=".95"/>
          <path d="M22 34a10 10 0 1 0 2.5-7l-3.5-3v10h10" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`
      },
      {
        name: "M. Terminal Arrow",
        tag: "命令行 · 脚本",
        bg: "linear-gradient(135deg,#1f2937,#3b82f6)",
        svg: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="14" width="48" height="36" rx="4" fill="white" fill-opacity=".95"/>
          <path d="M18 26l7 6-7 6" stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="30" y1="40" x2="44" y2="40" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
        </svg>`
      },
      {
        name: "N. Layered Chip",
        tag: "层叠方块 · 极简",
        bg: "linear-gradient(135deg,#111827,#6b7280)",
        svg: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="12" y="28" width="22" height="22" rx="4" fill="white" fill-opacity=".7"/>
          <rect x="24" y="18" width="22" height="22" rx="4" fill="white" fill-opacity=".85"/>
          <rect x="36" y="8" width="16" height="16" rx="4" fill="white"/>
        </svg>`
      },
      {
        name: "O. Infinity Loop",
        tag: "无限 · 持续同步",
        bg: "linear-gradient(135deg,#f43f5e,#fb923c)",
        svg: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 32a8 8 0 0 1 14-5l4 5 4-5a8 8 0 1 1 0 10l-4-5-4 5a8 8 0 0 1-14-5z" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`
      },
      {
        name: "P. Squircle Link",
        tag: "圆角方块 · 链接",
        bg: "linear-gradient(135deg,#0ea5e9,#6366f1)",
        svg: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="10" width="22" height="22" rx="6" fill="white" fill-opacity=".9"/>
          <rect x="32" y="32" width="22" height="22" rx="6" fill="white" fill-opacity=".9"/>
          <path d="M22 32V22m10 10H22m10 10v10m10-10h10" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>`
      }
    ];

    const grid = document.getElementById("grid");
    const chosen = document.getElementById("chosen");
    let selectedEl = null;

    for (const icon of ICONS) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="icon-box" style="background:${icon.bg}">${icon.svg}</div>
        <div class="name">${icon.name}</div>
        <div class="tag">${icon.tag}</div>
      `;
      card.addEventListener("click", () => {
        if (selectedEl) selectedEl.classList.remove("selected");
        card.classList.add("selected");
        selectedEl = card;
        chosen.innerHTML = `已选择：<strong>${icon.name}</strong> · ${icon.tag}<br><span style="font-size:12px">把这个名称告诉 Claude，即可导出为 PNG/ICO 替换项目图标。</span>`;
      });
      grid.appendChild(card);
    }
  </script>
</body>
</html>
