<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content First</title>
  <link rel="stylesheet" href="./shared.css">
  <style>
    .content-layout {
      display: grid;
      gap: 16px;
    }

    .content-topbar,
    .content-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
    }

    .content-brand {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .content-title {
      margin: 0;
      font-family: var(--fs-font-display);
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .content-inline-search {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .content-inline-search .search-field {
      min-height: 46px;
      flex: 1 1 420px;
    }

    .content-inline-search .action-cluster {
      gap: 8px;
    }

    @media (max-width: 920px) {
      .content-topbar,
      .content-toolbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .content-inline-search .action-cluster {
        width: 100%;
      }
    }
  </style>
  <script src="./mock-data.js"></script>
</head>
<body>
  <div class="preview-page">
    <div id="app"></div>
  </div>

  <script>
    const content = window.fileShareHomepageMock;
    const data = content.data;

    document.getElementById('app').innerHTML = `
      <main class="canvas">
        <div class="canvas-inner content-layout">
          <header class="panel content-topbar">
            <div class="content-brand">
              <div class="eyebrow">Content First</div>
              <h1 class="content-title">${content.escapeHtml(data.productName)} / ${content.escapeHtml(data.workspaceLabel)}</h1>
            </div>
            <div class="status-meta">
              <span class="pill strong">${content.escapeHtml(data.session.name)}</span>
              <span class="pill">${content.escapeHtml(data.session.status)}</span>
            </div>
          </header>

          <section class="panel content-toolbar">
            <div class="breadcrumbs">${content.renderBreadcrumbs()}</div>
            <div class="content-inline-search">
              <div class="search-field">
                ${content.iconSvg('search')}
                <input value="" placeholder="${content.escapeHtml(data.searchPlaceholder)}" />
                <button class="submit-button">搜索</button>
              </div>
              <div class="action-cluster">
                ${content.renderActions({
                  'upload-file': 'primary',
                  'upload-folder': 'secondary',
                  'new-folder': 'ghost',
                  'refresh': 'ghost',
                })}
              </div>
            </div>
          </section>

          <section class="meta-row panel" style="padding:12px 18px;">
            <div class="meta-group">
              <span class="chip strong">文件区优先</span>
              <span class="chip">更薄的界面 chrome</span>
            </div>
            <span class="muted-copy">${content.escapeHtml(data.flashText)}</span>
          </section>

          ${content.renderTable("当前共享目录", "7 项内容")}
          ${content.renderFooter()}
        </div>
      </main>
    `;
  </script>
</body>
</html>
